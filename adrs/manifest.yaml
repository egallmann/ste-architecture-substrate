    directory paths, discovery bundles, manifest files, sibling repo resolution.

    '
  introduced_by: ADR-L-0004
  lifecycle_stage: proposed
- entity_id: DEC-0020
  entity_type: decision
  name: 'Discovery mechanism: substrate-index.yaml (entrypoint), substrate-manifest.yaml

    (metadata), registries (artifacts by type).

    '
  introduced_by: ADR-L-0004
  lifecycle_stage: proposed
- entity_id: DEC-0021
  entity_type: decision
  name: 'Artifact resolution: consumers read from conventional paths (seeds/, building-blocks/,

