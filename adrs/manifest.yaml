- entity_id: DEC-0024
  entity_type: decision
  name: 'The discovery surface MUST be generated from corpus metadata files.

    Discovery files MUST NOT be hand-authored as primary artifacts.

    '
  introduced_by: ADR-L-0005
  lifecycle_stage: proposed
- entity_id: DEC-0025
  entity_type: decision
  name: 'A corpus sync command MUST regenerate the complete discovery surface

    (index, manifest, all registries) from a single invocation.

    '
  introduced_by: ADR-L-0005
  lifecycle_stage: proposed
- entity_id: DEC-0026
  entity_type: decision
  name: 'A corpus check command MUST verify bidirectional integrity between the

    discovery index and the corpus filesystem, and MUST exit non-zero on drift.

    '
  introduced_by: ADR-L-0005
  lifecycle_stage: proposed
- entity_id: DEC-0027
  entity_type: decision
  name: 'Corpus check MUST be wired as a repo contract guard: either a pre-push hook

    or a CI gate that runs on every commit touching corpus/ or discovery/.

    '
  introduced_by: ADR-L-0005
  lifecycle_stage: proposed
- entity_id: DEC-0028
  entity_type: decision
  name: 'Corpus tooling MUST be executable without package installation: a standalone

    Python script runnable with the repo''s standard Python environment.

    '
  introduced_by: ADR-L-0005
  lifecycle_stage: proposed
- entity_id: DEC-0029
  entity_type: decision
  name: 'Corpus tooling MUST NOT write to corpus/; it MUST only read corpus/ and

    write discovery/.

    '
  introduced_by: ADR-L-0005
